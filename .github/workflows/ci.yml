name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install backend
        run: cd backend && uv sync --extra dev --extra models
      - name: Install frontend
        run: cd frontend && npm ci
      - name: Test
        run: make test

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install ffmpeg
        run: choco install ffmpeg --no-progress -y
      - name: Create test temp dir
        # a directory with a space and a non-ASCII letter, so test data dirs exercise such paths. Set here, not in the
        # job's env: the runner context is not available there (GitHub rejects the whole workflow file).
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "J$([char]0xF6)hn Doe"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          "SHADOW_TEST_TMP=$dir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install backend
        working-directory: backend
        run: uv sync --extra dev --extra models --extra desktop
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Backend tests
        working-directory: backend
        run: uv run pytest -q
      - name: Packaging tests
        working-directory: backend
        run: uv run pytest ../packaging/windows -q
      - name: Frontend tests
        working-directory: frontend
        run: npm test -- --run
      - name: Frontend lint and types
        working-directory: frontend
        run: |
          npx eslint .
          npx tsc -b
      - name: Install Inno Setup
        if: hashFiles('packaging/windows/build.ps1') != ''
        # windows-latest already ships Inno Setup 6 (build.ps1 finds it in Program Files (x86)); installing a pinned,
        # older version on top fails ("a newer version is already installed"), so install only when it is missing.
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if ((Get-Command ISCC.exe -ErrorAction SilentlyContinue) -or (Test-Path $iscc)) { Write-Host 'Inno Setup 6 is preinstalled' }
          else { choco install innosetup --no-progress -y }
      - name: Build installer
        if: hashFiles('packaging/windows/build.ps1') != ''
        run: ./packaging/windows/build.ps1   # version defaults to backend/pyproject.toml; writes dist/chinese-shadow-speech-X.Y.Z-setup.exe
      - name: Upload installer
        if: hashFiles('packaging/windows/build.ps1') != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/chinese-shadow-speech-*-setup.exe
          if-no-files-found: error
          retention-days: 7
