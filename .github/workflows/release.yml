name: release

# Builds the Windows installer and attaches it to a GitHub Release, on a version tag only (vX.Y.Z).
on:
  push:
    tags: ["v*"]

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write   # only to attach the installer to the release
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check the tag matches backend/pyproject.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') { throw "tag '$tag' is not vX.Y.Z" }
          $version = $Matches[1]
          $m = Select-String -Path backend/pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $m) { throw 'no version in backend/pyproject.toml' }
          $project = $m.Matches[0].Groups[1].Value
          if ($project -ne $version) { throw "tag $tag does not match backend/pyproject.toml version $project" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install Inno Setup
        # windows-latest already ships Inno Setup 6 (build.ps1 finds it in Program Files (x86)); installing a pinned,
        # older version on top fails ("a newer version is already installed"), so install only when it is missing.
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if ((Get-Command ISCC.exe -ErrorAction SilentlyContinue) -or (Test-Path $iscc)) { Write-Host 'Inno Setup 6 is preinstalled' }
          else { choco install innosetup --no-progress -y }
      - name: Build installer
        run: ./packaging/windows/build.ps1 -Version $env:VERSION
      - name: Attach to the release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/chinese-shadow-speech-${{ env.VERSION }}-setup.exe
          fail_on_unmatched_files: true
