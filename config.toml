[server]
host = "127.0.0.1"
port = 8000

[models]
device = "auto"                     # auto | cuda | cpu
asr = "iic/speech_paraformer-large-vad-punc_asr_nat-zh-cn-16k-common-vocab8404-pytorch"
aligner = "auto"                    # auto (→ mms_fa) | qwen3_fa | mms_fa | mfa
gop_model = "wbbbbb/wav2vec2-large-chinese-zh-cn"
tone_embedder = "TencentGameMate/chinese-wav2vec2-base"
tone_embedder_revision = "3991242c806928916fff4a8c0e4f76acf661b743"
tone_layer = 6

[llm]
model = "claude-sonnet-5-5"
effort = "low"
rectify = true
translate = true

[segmentation]
min_chars = 6
max_chars = 25
pad_ms = 120

[scoring]
tone_weight = 0.5
dtw_band = 4
f0_floor = 60
f0_ceiling = 500
normalise_span = true
min_voiced_frames = 4
gop_margin = 2.0
min_duration_ratio = 0.4
green_at = 0.7
wrong_margin = 0.25
ref_confidence = 0.6
min_rms_dbfs = -55.0
min_align_conf = 0.05
min_text_similarity = 0.55
max_clipped = 0.01
profile_seconds = 60.0
tone_model = "tone_v1"

[practice]
hide_text_while_recording = true
chorus_passes = 5
flow_gap_factor = 1.1
move_on_after = 4

[youtube]
enabled = true
max_minutes = 90                    # longer videos are refused
cookies_file = ""                   # Netscape cookies.txt for age/bot-checked videos (docs/running.md)

[anki]
default_url = "http://127.0.0.1:8765"
