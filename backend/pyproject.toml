[project]
name = "shadow"
version = "0.2.0"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "sse-starlette>=2.1",
  "jieba>=0.42",
  "pypinyin>=0.53",
  "opencc-python-reimplemented>=0.1.7",
  "rapidfuzz>=3.9",
  "soundfile>=0.12",
  "numpy>=1.26",
  "yt-dlp[default]>=2026.8.19",
  "praat-parselmouth>=0.4.5",
  "scikit-learn==1.9.*",
  "joblib>=1.4",
  "psutil>=7.2.2",
]

[project.optional-dependencies]
models = [
  "torch==2.11.*",
  "torchaudio==2.11.*",
  "funasr>=1.2",
  "modelscope>=1.20",
  "qwen-asr>=0.0.6",
  "transformers>=4.57",
  "sherpa-onnx==1.13.8",         # these two move together: the wheel needs the same version of -core for
  "sherpa-onnx-core==1.13.8",    # libonnxruntime, which uv cannot see from the sdist metadata
]
desktop = [
  "pystray>=0.19; sys_platform == 'win32'",
  "pillow>=10",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
]

[tool.uv]
default-groups = []

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'win32'" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["models: needs downloaded models / GPU (deselected by default)"]
addopts = "-m 'not models'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shadow"]
