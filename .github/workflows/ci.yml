name: ci

on:
  push:
    branches: [main, worktree-windows-package]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install backend
        run: cd backend && uv sync --extra dev --extra models
      - name: Install frontend
        run: cd frontend && npm ci
      - name: Test
        run: make test

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
      # a directory with a space and a non-ASCII letter, so test data dirs exercise such paths
      SHADOW_TEST_TMP: ${{ runner.temp }}\Jöhn Doe
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install ffmpeg
        run: choco install ffmpeg --no-progress -y
      - name: Create test temp dir
        run: New-Item -ItemType Directory -Force -Path "$env:SHADOW_TEST_TMP" | Out-Null
      - name: Install backend
        working-directory: backend
        run: uv sync --extra dev --extra models --extra desktop
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Backend tests
        working-directory: backend
        run: uv run pytest -q
      - name: Packaging tests
        working-directory: backend
        run: uv run pytest ../packaging/windows -q
      - name: Frontend tests
        working-directory: frontend
        run: npm test -- --run
      - name: Frontend lint and types
        working-directory: frontend
        run: |
          npx eslint .
          npx tsc -b
      - name: Build installer
        if: hashFiles('packaging/windows/build.ps1') != ''
        run: ./packaging/windows/build.ps1
      - name: Upload installer
        if: hashFiles('packaging/windows/build.ps1') != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: packaging/windows/dist/*
          if-no-files-found: warn
