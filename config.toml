[server]
host = "127.0.0.1"
port = 8000

[models]
device = "auto"                     # auto | cuda | cpu
asr = "iic/speech_paraformer-large-vad-punc_asr_nat-zh-cn-16k-common-vocab8404-pytorch"
aligner = "auto"                    # auto (→ mms_fa) | qwen3_fa | mms_fa | mfa
gop_model = "wbbbbb/wav2vec2-large-chinese-zh-cn"
tone_embedder = "TencentGameMate/chinese-wav2vec2-base"
tone_embedder_revision = "3991242c806928916fff4a8c0e4f76acf661b743"
tone_layer = 6

[segmentation]
pad_ms = 120

[scoring]
tone_weight = 0.5
dtw_band = 4
f0_floor = 60
f0_ceiling = 500
normalise_span = true
min_voiced_frames = 4
gop_margin = 2.0
min_duration_ratio = 0.4
green_at = 0.7
wrong_margin = 0.25
ref_confidence = 0.6
min_rms_dbfs = -55.0
min_align_conf = 0.05
min_text_similarity = 0.25
words_ok_at = 0.55
max_clipped = 0.01
profile_seconds = 60.0
tone_model = "tone_v1"

[practice]
hide_text_while_recording = true
chorus_passes = 5
flow_gap_factor = 1.1
move_on_after = 4

[youtube]
enabled = true
max_minutes = 90                    # longer videos are refused
cookies_file = ""                   # Netscape cookies.txt for age/bot-checked videos (docs/running.md)

[anki]
default_url = "http://127.0.0.1:8765"

[drill]
window_days = 30
min_rows = 8
queue_size = 10
max_tries = 3
max_per_lesson = 4
min_syllables = 4
max_syllables = 15
rotate_within = 0.05

[sounds]
enabled = true                      # wrong-sound (initial/final) checks on takes
model = "wbbbbb/wav2vec2-large-chinese-zh-cn"
revision = "b654b5f3df69725df32808de454a1b865c829e4c"
z_a_mean = -4.006537                # z-normalisers for model A (GOP on the planned syllable)
z_a_sd = 2.974512
z_b_mean = 1.239741                 # normalisers for model B (bad-pronunciation score)
z_b_sd = 3.072057
fused_threshold = 5.3036            # slip when z_a + z_b exceeds this
b_only_threshold = 11.6518          # slip on raw model-B score alone when model A has no reading
